name: Acquire activation file
on:
  workflow_dispatch: {}

jobs:
  activation:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/boost
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Generate Unity activation file
        run: |
          docker run --rm \
            -v ${{ github.workspace }}:/output \
            unityci/editor:ubuntu-2021.3.45f1-base-3 \
            /bin/bash -c 'unity-editor -batchmode -createManualActivationFile -logFile /dev/stdout || true; find / -name "*.alf" -exec cp {} /output/ \;'

      - name: Upload activation file
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: activation-file
          path: "*.alf"
          retention-days: 1
